# ============================================================
# Mengaktifkan AndroidX untuk kompatibilitas library modern
# enableJetifier=false: semua dependency sudah native AndroidX,
# jadi Jetifier dimatikan agar build lebih cepat.
#   (Kalau build error "android.support.*", artinya ada dependency
#    yang masih Support-based → set kembali true.)
# ============================================================
android.useAndroidX=true
android.enableJetifier=false

# ============================================================
# Alokasi memori JVM (2GB) dan encoding karakter
# -Xmx: batas heap JVM Gradle; cukup besar agar tidak cepat OOM
# saat parallel build.
# ============================================================
org.gradle.jvmargs=-Xmx1500m -Dfile.encoding=UTF-8

# ============================================================
# Konfigurasi performa untuk stabilitas build di AndroidIDE
# ============================================================

# daemon: JVM Gradle tetap hidup di background → build berulang lebih
# cepat (JVM sudah panas). Kalau false, tiap build mulai JVM baru dari
# nol (lebih lambat build ke-2/ke-3).
org.gradle.daemon=true

# parallel: menjalankan task antar module secara paralel → build
# multi-module lebih cepat.
org.gradle.parallel=true

# workers.max: jumlah worker paralel yang dipakai saat build.
org.gradle.workers.max=4

# configureondemand: hanya mengonfigurasi project yang benar-benar
# dibutuhkan build → lebih ringan.
org.gradle.configureondemand=true

# caching=false: build cache global dimatikan → build selalu dari nol
# per-task yang berubah. Berguna untuk tes/diagnostic; untuk build
# harian lokal lebih cepat pakai true.
org.gradle.caching=true

# vfs.watch: memantau file system agar Gradle cepat mendeteksi
# perubahan input file.
org.gradle.vfs.watch=true

# ============================================================
# Menghilangkan peringatan deprecation Java
# ============================================================
android.javaCompile.suppressSourceTargetDeprecationWarning=true

# ============================================================
# Mengatur level log ke 'lifecycle' agar terminal tidak berisik
# # debug, lifecycle, info, warn, quiet
# ============================================================
org.gradle.logging.level=lifecycle

# ============================================================
# Pengaturan otomatis untuk tampilan konsol terminal
# ============================================================
org.gradle.console=auto