# Mengaktifkan AndroidX dan Jetifier untuk kompatibilitas library modern
android.useAndroidX=true
android.enableJetifier=true

# Alokasi memori JVM (3GB) dan encoding karakter (batas aman 4GB)
org.gradle.jvmargs=-Xmx1800m -Dfile.encoding=UTF-8

# Konfigurasi performa untuk stabilitas build di AndroidIDE
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.workers.max=4
org.gradle.configureondemand=true
org.gradle.caching=true
org.gradle.vfs.watch=true

# Menghilangkan peringatan deprecation Java
android.javaCompile.suppressSourceTargetDeprecationWarning=true

# Mengatur level log ke 'warn' agar terminal tidak berisik # debug, lifecycle, info, warn, quiet
org.gradle.logging.level=lifecycle

# Pengaturan otomatis untuk tampilan konsol terminal
org.gradle.console=auto