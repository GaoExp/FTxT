name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Android SDK
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "sdk.dir=$SDK_DIR" > local.properties
          echo "-> local.properties:"
          cat local.properties
          echo "-> ANDROID_HOME=$ANDROID_HOME"
          echo "-> ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Install SDK components & accept licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $SDK_DIR/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" 2>/dev/null || true

      - name: Setup keystore from org secrets
        run: |
          echo "${{ secrets.ORG_KEYSTORE_B64 }}" | base64 -d > key/release.jks
          echo "storeFile=../key/release.jks" > keystore.properties
          echo "storePassword=${{ secrets.ORG_KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.ORG_KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.ORG_KEY_PASSWORD }}" >> keystore.properties

      - name: Build APK Release
        run: ./gradlew assembleRelease --no-daemon

      - name: Debug — Print APK locations
        run: |
          echo "=== Mencari semua file APK ==="
          find . -type f -name "*.apk" 2>/dev/null
          echo "=== Selesai ==="

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/build/outputs/apk/release/*.apk
          generate_release_notes: true
