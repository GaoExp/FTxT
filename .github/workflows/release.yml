name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Android SDK
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "sdk.dir=$SDK_DIR" > local.properties

      - name: Install SDK components
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $SDK_DIR/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "Checking KEYSTORE_BASE64 secret availability"
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Error: KEYSTORE_BASE64 secret is empty or not set"
            exit 1
          fi

          mkdir -p key
          echo "Decoding keystore to key/audiplay-release-key.jks (content suppressed)"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > key/audiplay-release-key.jks || { echo "Failed to decode KEYSTORE_BASE64"; exit 1; }

          echo "Keystore decoded. File info:"
          ls -l key/audiplay-release-key.jks || true
          file key/audiplay-release-key.jks || true

      - name: Generate keystore.properties for signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > keystore.properties << EOF
          storeFile=../key/audiplay-release-key.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "keystore.properties created"

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon

      - name: Debug APK Files
        run: |
          find . -type f -name "*.apk"

      - name: Extract Release Notes
        id: changelog
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # Strip "v" prefix from tag name (github.ref_name = v1.x.x.x.x)
          VERSION="${VERSION#v}"

          NOTES=$(awk -v ver="$VERSION" '
            $0 ~ "^# \\[" ver "\\]" { found=1; skip=0; next }
            found && /^# \[/ { exit }
            found && /^### / {
              if ($0 ~ /🗒️ File Added|✏️ File Changed|🔥 File Removed/) {
                skip=1; next
              }
              skip=0
            }
            found && !skip { print }
          ' CHANGELOG.md)

          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/build/outputs/apk/release/*.apk
          body: ${{ steps.changelog.outputs.notes }}
