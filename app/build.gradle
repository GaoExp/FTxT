// Override aapt2 hanya diterapkan di sistem aarch64 (AndroidIDE).
// Di CI (ubuntu x86_64) biarkan AGP memakai aapt2 dari Maven agar rilis GitHub tidak gagal.
if (System.getProperty("os.arch", "").toLowerCase().contains("aarch64")) {
    project.setProperty("android.aapt2FromMavenOverride", "/usr/bin/aapt2")
}

apply plugin: 'com.android.application'

// Load keystore properties from the project root (optional; file may not exist on all machines/CI)
import java.util.Properties

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {

    namespace = "exp.ftxt"
    compileSdk 35

    defaultConfig {
        applicationId "exp.ftxt"

        minSdk 26
        targetSdk 35

        versionCode 214
        versionName "4.89.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {

        debug {
            applicationIdSuffix ".debug"
            resValue "string", "app_name", "FTxTdebug"
        }

        release {
            minifyEnabled false

            proguardFiles(
                    getDefaultProguardFile('proguard-android.txt'),
                    'proguard-rules.pro'
            )

            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            }
        }
    }

    // Rename APK output automatically
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def appName = "FTxT"
            def version = variant.versionName

            outputFileName = "${appName}-v${version}-Beta.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        disable 'MissingDefaultResource'
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << "-Xlint:none"
    }
}

task syncDocs(type: Copy) {
    from rootProject.rootDir
    include 'README.md', 'CHANGELOG.md', 'PANDUAN.md', 'STRUKTUR.md'
    into "$project.projectDir/src/main/assets"
}

preBuild.dependsOn syncDocs

dependencies {

    implementation fileTree(
            dir: 'libs',
            include: ['*.jar']
    )

    implementation project(':shared:config')

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:ext-tables:4.6.2'
    implementation 'io.noties.markwon:ext-tasklist:4.6.2'

    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}